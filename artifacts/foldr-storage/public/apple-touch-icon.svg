<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0f0a1f"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0DCCF2"/>
      <stop offset="100%" stop-color="#7E47EB"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Dark background for iOS home screen -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Folder shape (same as favicon but slightly smaller/centered) -->
  <path
    d="M12 46
       L12 80 Q12 88 20 88
       L80 88 Q88 88 88 80
       L88 46 Q88 38 80 38
       L55 38 Q47 38 43 31
       L39 24 Q35 16 26 16
       L20 16 Q12 16 12 24
       Z"
    fill="url(#grad)"
  />

  <!-- Top shine -->
  <path
    d="M12 46
       L12 60 L88 60
       L88 46 Q88 38 80 38
       L55 38 Q47 38 43 31
       L39 24 Q35 16 26 16
       L20 16 Q12 16 12 24
       Z"
    fill="url(#shine)"
  />

  <!-- Ridge line -->
  <line x1="12" y1="46" x2="88" y2="46" stroke="white" stroke-opacity="0.18" stroke-width="1.5"/>
</svg>
